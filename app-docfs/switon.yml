# app-docfs — docfs sample (Git SSOT, MCP tools, no DB)

Switon\Core\AppInterface:
  id: app-docfs
  name: docfs
  env: ${APP_ENV:-dev}
  debug: ${APP_DEBUG:-false}
  timezone: ${APP_TIMEZONE:-UTC}
  version: 0.1.0

Switon\Core\LocaleInterface:
  default: en

Switon\Http\ServerOptions:
  type: ${SERVER_TYPE:-php}
  host: ${SERVER_HOST:-0.0.0.0}
  port: ${SERVER_PORT:-9520}
  settings:
    enable_static_handler: ${APP_DEBUG:-false}

Switon\Routing\RouterInterface:
  prefix: ""

Switon\Http\RequestHandlerInterface:
  filters:
    cors: Switon\Http\Filter\CorsFilter
    accessLog: null

Psr\Log\LoggerInterface:
  level: ${LOG_LEVEL:-debug}

Switon\Mcp\ServerInfoInterface:
  name: docfs
  version: 0.1.0

# MCP tools: default ToolDiscovery scans @app/Mcp/Tool/*Tool.php (abstract DocfsTool skipped).

# Book repos root (one git repo per slug). Override with absolute BOOKS_ROOT.
Switon\Core\PathAliasInterface:
  aliases:
    '@books': ${BOOKS_ROOT:-@runtime/books}

# Credential: JWT from Session (Bearer / access_key); no token → error.
App\Docfs\CredentialInterface:
  class: App\Docfs\Credential

# Jwt pulls Cipher at inject time even when a static key is set.
Switon\Crypto\CipherInterface:
  secret: ${MASTER_KEY:-dev}
  method: AES-128-CBC

Switon\Jwt\JwtInterface:
  alg: HS256
  key: ${DOCFS_JWT_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  leeway: 60
