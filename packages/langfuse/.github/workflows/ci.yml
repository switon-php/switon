name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, swoole
          coverage: none

      # The queue and coroutine-dispatch tests skip themselves without swoole, which would hide
      # exactly the export-ordering behaviour this package exists for.
      - name: Confirm Swoole is loaded
        run: php -r 'exit(extension_loaded("swoole") ? 0 : 1);'

      - name: Install package dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer metadata
        run: composer validate --no-check-lock --no-plugins

      - name: Run PHPStan
        run: composer run phpstan

      - name: Run fast package tests
        run: composer run test:unit
