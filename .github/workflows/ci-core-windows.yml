name: Core on Windows

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-core-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / windows-latest / PHP 8.5
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Name the checkout dev
        run: git checkout -B dev

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          extensions: redis, sockets, fileinfo

      - name: Install monorepo dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist

      - name: Install shared test dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: packages/testing
          composer-options: --no-interaction --prefer-dist

      - name: Run release check
        run: bash build/release-check.sh core --fast -- --debug
